<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#130D25" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3B0764" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.6" />
    </linearGradient>

    <!-- Top Voxel Face Gradient -->
    <linearGradient id="voxel-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9D5FF" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Left Voxel Face Gradient -->
    <linearGradient id="voxel-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>

    <!-- Right Voxel Face Gradient -->
    <linearGradient id="voxel-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7E22CE" />
      <stop offset="100%" stop-color="#3B0764" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="purple-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="core-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Container Base Badge -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="8" />

  <!-- Ambient Glow Behind Voxel -->
  <circle cx="256" cy="240" r="140" fill="#A855F7" opacity="0.25" filter="url(#purple-glow)" />

  <!-- Stylized Isometric Voxel "V" Structure -->
  <g transform="translate(0, 16)" filter="url(#core-glow)">
    
    <!-- LEFT WING OF 'V' (Upper Left Voxel Block) -->
    <!-- Top Face -->
    <polygon points="144,140 192,112 240,140 192,168" fill="url(#voxel-top)" />
    <!-- Left Face -->
    <polygon points="144,140 192,168 192,224 144,196" fill="url(#voxel-left)" />
    <!-- Right Face -->
    <polygon points="192,168 240,140 240,196 192,224" fill="url(#voxel-right)" />

    <!-- RIGHT WING OF 'V' (Upper Right Voxel Block) -->
    <!-- Top Face -->
    <polygon points="272,140 320,112 368,140 320,168" fill="url(#voxel-top)" />
    <!-- Left Face -->
    <polygon points="272,140 320,168 320,224 272,196" fill="url(#voxel-left)" />
    <!-- Right Face -->
    <polygon points="320,168 368,140 368,196 320,224" fill="url(#voxel-right)" />

    <!-- BOTTOM APEX OF 'V' (Lower Center Voxel Block) -->
    <!-- Top Face -->
    <polygon points="208,252 256,224 304,252 256,280" fill="url(#voxel-top)" />
    <!-- Left Face -->
    <polygon points="208,252 256,280 256,344 208,316" fill="url(#voxel-left)" opacity="0.95" />
    <!-- Right Face -->
    <polygon points="256,280 304,252 304,316 256,344" fill="url(#voxel-right)" opacity="0.95" />

    <!-- LOWEST ACCENT VOXEL TIP -->
    <!-- Top Face -->
    <polygon points="232,348 256,334 280,348 256,362" fill="#E9D5FF" />
    <!-- Left Face -->
    <polygon points="232,348 256,362 256,384 232,370" fill="#C084FC" />
    <!-- Right Face -->
    <polygon points="256,362 280,348 280,370 256,384" fill="#A855F7" />

    <!-- CONNECTING GLOW WIRE PATHS (The "Wire" element) -->
    <path d="M192 224 L256 280 L320 224" stroke="#F0ABFC" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
    <path d="M256 280 L256 334" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.95" />
  </g>

  <!-- Glowing Pulse Dot (Matches Header Logo Pulse) -->
  <circle cx="256" cy="116" r="14" fill="#F0ABFC" filter="url(#core-glow)" />
  <circle cx="256" cy="116" r="8" fill="#FFFFFF" />
</svg>
